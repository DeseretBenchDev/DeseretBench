[project]
name = "deseretbench"
version = "0.1.0"
description = "DeseretBench — a reproducible benchmark for LDS (Latter-day Saint) doctrinal accuracy, cultural fluency, and life-choice alignment in large language models."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "CC-BY-NC-SA-4.0 (data) / MIT (code)" }
authors = [{ name = "DeseretBench contributors" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
# Researchers who want to run the canonical Anthropic Messages API backend.
api = ["anthropic>=0.40"]
# Publishing the dataset to the Hugging Face Hub.
hub = ["datasets>=2.18", "huggingface_hub>=0.23"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deseretbench"]
